org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend URL for debug builds. 10.0.2.2 is the host machine as seen from the
# Android emulator. For a real phone use your computer's LAN address, e.g.
# textsy.debugApiUrl=http://192.168.1.20:3000
# Release builds must be given the URL explicitly: -Ptextsy.apiUrl=https://api.example.com
textsy.debugApiUrl=http://10.0.2.2:3000
